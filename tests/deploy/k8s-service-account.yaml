---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: rnseism-test
  name: spark
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: rnseism-test
  name: spark-executor-creator
rules:
- apiGroups: ["*"]
  resources: ["pods", "pods/log", "pods/exec", "services", "configmaps" ]
  verbs: ["get", "watch", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-binding
  namespace: rnseism-test
subjects:
- kind: ServiceAccount
  name: spark
roleRef:
  kind: Role
  name: spark-executor-creator
  apiGroup: rbac.authorization.k8s.io
