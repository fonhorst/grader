# Default values for grader-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Grader service configuration
grader:
  enabled: true
  replicaCount: 1
  image:
    repository: node2.bdcl:5000/grader-app
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 1
      memory: 2Gi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  config:
    version: "0.1.2"
    rabbitmq:
      host: rabbitmq
      port: 5672
      user: admin
      password: admin
    postgres:
      host: postgresql
      port: 5432
      user: postgres
      password: postgres
      database: grader

# PostgreSQL configuration
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17.4-bookworm"
    pullPolicy: IfNotPresent
  auth:
    username: postgres
    password: postgres
    database: grader
  persistence:
    enabled: true
    size: 8Gi
    storageClass: "standard"
  resources:
    limits:
      cpu: 1
      memory: 4Gi
    requests:
      cpu: 1
      memory: 4Gi
  service:
    type: ClusterIP
    port: 5432

# pgAdmin configuration
pgadmin:
  enabled: true
  image:
    repository: dpage/pgadmin4
    tag: "2025-04-02-1"
    pullPolicy: IfNotPresent
  auth:
    email: admin@admin.com
    password: admin
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "standard"
  service:
    type: ClusterIP
    port: 80

# RabbitMQ configuration
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: "4.0.7-management"
    pullPolicy: IfNotPresent
  auth:
    username: admin
    password: admin
  persistence:
    enabled: true
    size: 8Gi
    storageClass: "standard"
  service:
    type: ClusterIP
    amqpPort: 5672
    managementPort: 15672
  resources:
    limits:
      cpu: 1
      memory: 4Gi
    requests:
      cpu: 1
      memory: 4Gi
  configuration:
    enabled: true
    configPath: /etc/rabbitmq/rabbitmq.conf
    pluginsPath: /etc/rabbitmq/enabled_plugins
    consumerSettingsPath: /etc/rabbitmq/conf.d/consumer-settings.conf

# This section builds out the service account
serviceAccount:
  create: true
  automount: true

