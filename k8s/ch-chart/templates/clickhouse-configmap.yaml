apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
    app: clickhouse
data:
  config.xml: |-
    <clickhouse>
      <path>{{ .Values.clickhouse.persistence.mountPath }}</path>
      <tmp_path>{{ .Values.clickhouse.persistence.mountPath }}/tmp</tmp_path>
      <user_files_path>{{ .Values.clickhouse.persistence.mountPath }}/user_files</user_files_path>
      <format_schema_path>{{ .Values.clickhouse.persistence.mountPath }}/format_schemas</format_schema_path>
      
      <listen_host>0.0.0.0</listen_host>

      {{- if .Values.clickhouse.config.settings.default_replica_path }}
      <default_replica_path>{{ .Values.clickhouse.config.settings.default_replica_path }}</default_replica_path>
      {{- end }}

      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id>1</server_id>
        <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>

        <coordination_settings>
            <operation_timeout_ms>10000</operation_timeout_ms>
            <session_timeout_ms>30000</session_timeout_ms>
            <raft_logs_level>warning</raft_logs_level>
        </coordination_settings>

        <raft_configuration>
            {{- $replicaCount := int .Values.clickhouse.replicaCount }}
            {{- range $i := until $replicaCount }}
            <server>
                <id>{{ add $i 1 }}</id>
                <hostname>clickhouse-{{ $i }}</hostname>
                <port>9234</port>
            </server>
            {{- end }}
        </raft_configuration>
      </keeper_server>
      
      <zookeeper>
        {{- $replicaCount := int .Values.clickhouse.replicaCount }}
        {{- range $i := until $replicaCount }}
        <node>
            <host>clickhouse-{{ $i }}</host>
            <port>9181</port>
        </node>
        {{- end }}
      </zookeeper>

      <remote_servers>
        <{{ .Values.clickhouse.config.clusterName }}>
          {{- $replicaCount := int .Values.clickhouse.replicaCount }}
          {{- range $i := until $replicaCount }}
          <shard>
              <replica>
                <host>clickhouse-{{ $i }}</host>
                <port>9000</port>
                <user>default</user>
                <password>{{ .Values.clickhouse.config.settings.default_password }}</password>
              </replica>
          </shard>
          {{- end }}
        </{{ .Values.clickhouse.config.clusterName }}>
      </remote_servers>
    </clickhouse>
  
  users.xml: |-
    <clickhouse>
      <profiles>
          <default>
          </default>

          <readonly>
              <readonly>1</readonly>
          </readonly>
      </profiles>

      <users>
          <default>
              <password></password>
              <networks>
                  <ip>::/0</ip>
              </networks>

              <!-- Settings profile for user. -->
              <profile>default</profile>

              <!-- Quota for user. -->
              <quota>default</quota>

              <!-- User can create other users and grant rights to them. -->
              <access_management>1</access_management>

              <!-- User can manipulate named collections. -->
              <named_collection_control>1</named_collection_control>

              <!-- User permissions can be granted here -->
              <!--
              <grants>
                  <query>GRANT ALL ON *.*</query>
              </grants>
              -->
          </default>
      </users>

      <!-- Quotas. -->
      <quotas>
          <!-- Name of quota. -->
          <default>
              <!-- Limits for time interval. You could specify many intervals with different limits. -->
              <interval>
                  <!-- Length of interval. -->
                  <duration>3600</duration>

                  <!-- No limits. Just calculate resource usage for time interval. -->
                  <queries>0</queries>
                  <errors>0</errors>
                  <result_rows>0</result_rows>
                  <read_rows>0</read_rows>
                  <execution_time>0</execution_time>
              </interval>
          </default>
      </quotas>
    </clickhouse>

config_d_docker_related_config.xml: |-
  <clickhouse>
     <!-- Listen wildcard address to allow accepting connections from other containers and host network. -->
    <listen_host>::</listen_host>
    <listen_host>0.0.0.0</listen_host>
    <listen_try>1</listen_try>

    <!--
    <logger>
        <console>1</console>
    </logger>
    -->
  </clickhouse>

