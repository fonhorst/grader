apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
    app: clickhouse
data:
  config.xml: |-
    <clickhouse>
      <path>{{ .Values.clickhouse.persistence.mountPath }}</path>
      <tmp_path>{{ .Values.clickhouse.persistence.mountPath }}/tmp</tmp_path>
      <user_files_path>{{ .Values.clickhouse.persistence.mountPath }}/user_files</user_files_path>
      <format_schema_path>{{ .Values.clickhouse.persistence.mountPath }}/format_schemas</format_schema_path>
      
      <listen_host>0.0.0.0</listen_host>

      {{- if .Values.clickhouse.config.settings.default_replica_path }}
      <default_replica_path>{{ .Values.clickhouse.config.settings.default_replica_path }}</default_replica_path>
      {{- end }}

      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id>1</server_id>
        <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>

        <coordination_settings>
            <operation_timeout_ms>10000</operation_timeout_ms>
            <session_timeout_ms>30000</session_timeout_ms>
            <raft_logs_level>warning</raft_logs_level>
        </coordination_settings>

        <raft_configuration>
            {{- $replicaCount := int .Values.clickhouse.replicaCount }}
            {{- range $i := until $replicaCount }}
            <server>
                <id>{{ add $i 1 }}</id>
                <hostname>clickhouse-{{ $i }}</hostname>
                <port>9234</port>
            </server>
            {{- end }}
        </raft_configuration>
      </keeper_server>
      
      <zookeeper>
        {{- $replicaCount := int .Values.clickhouse.replicaCount }}
        {{- range $i := until $replicaCount }}
        <node>
            <host>clickhouse-{{ $i }}</host>
            <port>9181</port>
        </node>
        {{- end }}
      </zookeeper>

      <remote_servers>
        <{{ .Values.clickhouse.config.clusterName }}>
          {{- $replicaCount := int .Values.clickhouse.replicaCount }}
          {{- range $i := until $replicaCount }}
          <shard>
              <replica>
                <host>clickhouse-{{ $i }}</host>
                <port>9000</port>
                <user>default</user>
                <password>{{ .Values.clickhouse.config.settings.default_password }}</password>
              </replica>
          </shard>
          {{- end }}
        </{{ .Values.clickhouse.config.clusterName }}>
      </remote_servers>
    </clickhouse>
  

  users.xml: |
    <clickhouse>
      <!-- See also the files in users.d directory where the settings can be overridden. -->

      <!-- Profiles of settings. -->
      <profiles>
          <!-- Default settings. -->
          <default>
          </default>

          <!-- Profile that allows only read queries. -->
          <readonly>
              <readonly>1</readonly>
          </readonly>
      </profiles>

      <!-- Users and ACL. -->
      <users>
          <!-- If user name was not specified, 'default' user is used. -->
          <default>
              <!-- See also the files in users.d directory where the password can be overridden.

                  Password could be specified in plaintext or in SHA256 (in hex format).

                  If you want to specify password in plaintext (not recommended), place it in 'password' element.
                  Example: <password>qwerty</password>.
                  Password could be empty.

                  If you want to specify SHA256, place it in 'password_sha256_hex' element.
                  Example: <password_sha256_hex>65e84be33532fb784c48129675f9eff3a682b27168c0ea744b2cf58ee02337c5</password_sha256_hex>
                  Restrictions of SHA256: impossibility to connect to ClickHouse using MySQL JS client (as of July 2019).

                  If you want to specify double SHA1, place it in 'password_double_sha1_hex' element.
                  Example: <password_double_sha1_hex>e395796d6546b1b65db9d665cd43f0e858dd4303</password_double_sha1_hex>

                  If you want to specify a previously defined LDAP server (see 'ldap_servers' in the main config) for authentication,
                    place its name in 'server' element inside 'ldap' element.
                  Example: <ldap><server>my_ldap_server</server></ldap>

                  If you want to authenticate the user via Kerberos (assuming Kerberos is enabled, see 'kerberos' in the main config),
                    place 'kerberos' element instead of 'password' (and similar) elements.
                  The name part of the canonical principal name of the initiator must match the user name for authentication to succeed.
                  You can also place 'realm' element inside 'kerberos' element to further restrict authentication to only those requests
                    whose initiator's realm matches it.
                  Example: <kerberos />
                  Example: <kerberos><realm>EXAMPLE.COM</realm></kerberos>

                  How to generate decent password:
                  Execute: PASSWORD=$(base64 < /dev/urandom | head -c8); echo "$PASSWORD"; echo -n "$PASSWORD" | sha256sum | tr -d '-'
                  In first line will be password and in second - corresponding SHA256.

                  How to generate double SHA1:
                  Execute: PASSWORD=$(base64 < /dev/urandom | head -c8); echo "$PASSWORD"; echo -n "$PASSWORD" | sha1sum | tr -d '-' | xxd -r -p | sha1sum | tr -d '-'
                  In first line will be password and in second - corresponding double SHA1.
              -->
              <password></password>

              <!-- List of networks with open access.

                  To open access from everywhere, specify:
                      <ip>::/0</ip>

                  To open access only from localhost, specify:
                      <ip>::1</ip>
                      <ip>127.0.0.1</ip>

                  Each element of list has one of the following forms:
                  <ip> IP-address or network mask. Examples: 213.180.204.3 or 10.0.0.1/8 or 10.0.0.1/255.255.255.0
                      2a02:6b8::3 or 2a02:6b8::3/64 or 2a02:6b8::3/ffff:ffff:ffff:ffff::.
                  <host> Hostname. Example: server01.clickhouse.com.
                      To check access, DNS query is performed, and all received addresses compared to peer address.
                  <host_regexp> Regular expression for host names. Example, ^server\d\d-\d\d-\d\.clickhouse\.com$
                      To check access, DNS PTR query is performed for peer address and then regexp is applied.
                      Then, for result of PTR query, another DNS query is performed and all received addresses compared to peer address.
                      Strongly recommended that regexp is ends with $
                  All results of DNS requests are cached till server restart.
              -->
              <networks>
                  <ip>::/0</ip>
              </networks>

              <!-- Settings profile for user. -->
              <profile>default</profile>

              <!-- Quota for user. -->
              <quota>default</quota>

              <!-- User can create other users and grant rights to them. -->
              <access_management>1</access_management>

              <!-- User can manipulate named collections. -->
              <named_collection_control>1</named_collection_control>

              <!-- User permissions can be granted here -->
              <!--
              <grants>
                  <query>GRANT ALL ON *.*</query>
              </grants>
              -->
          </default>
      </users>

      <!-- Quotas. -->
      <quotas>
          <!-- Name of quota. -->
          <default>
              <!-- Limits for time interval. You could specify many intervals with different limits. -->
              <interval>
                  <!-- Length of interval. -->
                  <duration>3600</duration>

                  <!-- No limits. Just calculate resource usage for time interval. -->
                  <queries>0</queries>
                  <errors>0</errors>
                  <result_rows>0</result_rows>
                  <read_rows>0</read_rows>
                  <execution_time>0</execution_time>
              </interval>
          </default>
      </quotas>
  </clickhouse>

config_d_docker_related_config.xml: |
  <clickhouse>
     <!-- Listen wildcard address to allow accepting connections from other containers and host network. -->
    <listen_host>::</listen_host>
    <listen_host>0.0.0.0</listen_host>
    <listen_try>1</listen_try>

    <!--
    <logger>
        <console>1</console>
    </logger>
    -->
  </clickhouse>



