---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-clickhouse-configs
  labels:
    service: clickhouse-db
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: slow
  mountOptions:
    - relatime
  nfs:
    path: /nfs_storage/services/general-clickhouse-clickhouse
    readOnly: true
    server: 10.32.7.103
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: clickhouse
  name: pvc-clickhouse-configs
  labels:
    service: clickhouse-db
spec:
  volumeName: pv-clickhouse-configs
  storageClassName: slow
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-clickhouse-shared
  labels:
    service: clickhouse-db
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: slow
  mountOptions:
    - relatime
  nfs:
    path: /nfs_storage/shared
    readOnly: true
    server: 10.32.7.103
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: clickhouse
  name: pvc-clickhouse-shared
  labels:
    service: clickhouse-db
spec:
  volumeName: pv-clickhouse-shared
  storageClassName: slow
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: clickhouse
  name: clickhouse
spec:
  replicas: 9
  selector:
    matchLabels:
      service: clickhouse-db
  serviceName: "clickhouse"
  template:
    metadata:
      labels:
        service: clickhouse-db
    spec:
      terminationGracePeriodSeconds: 10
      volumes:
        - name: configs
          persistentVolumeClaim:
            claimName: pvc-clickhouse-configs
            readOnly: true
        - name: shared
          persistentVolumeClaim:
            claimName: pvc-clickhouse-shared
            readOnly: true
      containers:
        - name: clickhouse-server
          image: node03.st:5000/clickhouse/clickhouse-server:21.8.10.19
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "10"
              memory: "28Gi"
          ports:
            - containerPort: 8123  # HTTP Client
            - containerPort: 9000  # TCP Native Client
            - containerPort: 9009  # Inter-Server Replication
          volumeMounts:
            - name: pvc
              mountPath: /var/lib/clickhouse/
              subPath: "data"
            - name: configs
              mountPath: "/etc/clickhouse-server/config.xml"
              readOnly: true
              subPath: "config.xml"
            - name: configs
              mountPath: "/etc/clickhouse-server/users.xml"
              readOnly: true
              subPath: "users.xml"
            - name: pvc
              mountPath: /var/log/
              subPath: "log"
            - name: shared
              mountPath: "/nfs/shared"
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: pvc
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: local-storage
---
