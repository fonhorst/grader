# Storage configuration
storage:
  # Storage class name
  className: local-storage
  size: 100Gi

# Labels
labels:
  service: general-clickhouse

# Clickhouse configuration
clickhouse:
  replicas: 1
  image:
    repository: clickhouse/clickhouse-server
    tag: 22.3.13
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "16Gi"
      cpu: "2"
    limits:
      memory: "16Gi"
      cpu: "4"
  service:
    type: ClusterIP
    httpPort: 8123
    tcpPort: 9000
  persistence:
    enabled: true
    mountPath: /var/lib/clickhouse
  config:
    settings:
      default_replica_path: /var/lib/clickhouse/
      default_password: clickhouse

