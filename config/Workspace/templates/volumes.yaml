---
apiVersion: v1
kind: PersistentVolume
metadata:
  namespace: {{ .Values.user }}
  name: pv-{{- .Values.user }}
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: slow
  hostPath:
    path: {{ .Values.student_dir_path }}
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{ .Values.user }}
  name: pvc-{{- .Values.user }}
spec:
  volumeName: pv-{{- .Values.user }}
  storageClassName: slow
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  namespace: {{ .Values.user }}
  name: pv-shared-{{- .Values.user }}
spec:
  capacity:
    storage: 1000Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: slow
  hostPath:
    path: {{ .Values.shared_data_path }}
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{ .Values.user }}
  name: pvc-shared-{{- .Values.user }}
spec:
  volumeName: pv-shared-{{- .Values.user }}
  storageClassName: slow
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1000Gi
