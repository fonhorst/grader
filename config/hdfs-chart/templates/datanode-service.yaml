apiVersion: v1
kind: Service
metadata:
  name: datanode
  namespace: {{ .Values.namespace.name }}
spec:
  selector:
    app: datanode
  ports:
  - name: datanode
    port: {{ .Values.dataNode.service.port }}
    targetPort: datanode
  - name: web
    port: {{ .Values.dataNode.service.webPort }}
    targetPort: web 