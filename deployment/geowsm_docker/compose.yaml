services:
  redis:
    image: redis:7.2.0-alpine
    networks:
      - deploy_net
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]

  rabbitmq:
    image: geowsm-rabbitmq:latest
    build:
      context: ../..
      dockerfile: ./docker/rabbitmq.dockerfile
    ports:
      - "9091:15672"
    networks:
      - deploy_net
    configs:
      - source: rabbitmq_conf
        target: /etc/rabbitmq/rabbitmq.conf
      - source: rabbitmq_enabled_plugins
        target: /etc/rabbitmq/enabled_plugins
      - source: rabbitmq_consumer_settings
        target: /etc/rabbitmq/conf.d/consumer-settings.conf
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  postgresql:
    image: geowsm-postgresql:latest
    build:
      context: ../..
      dockerfile: ./docker/postgresql.dockerfile
    networks:
      - deploy_net
    environment:
      - POSTGRES_DB=wms
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./postgresql-initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d wms" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:7.6
    depends_on:
      - postgresql
    environment:
      PGADMIN_DEFAULT_EMAIL: "postgres@postgres.com"
      PGADMIN_DEFAULT_PASSWORD: "postgres"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "9092:80"
    networks:
      - deploy_net
    restart: unless-stopped

  flower:
    image: mher/flower
    depends_on:
      - rabbitmq
    ports:
      - "9093:5555"
    networks:
      - deploy_net
    environment:
      CELERY_BROKER_URL: "amqp://guest:guest@rabbitmq:5672"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"

  batch_worker:
    image: geowsm-worker:latest
    build:
      context: ../..
      dockerfile: ./docker/worker.dockerfile
    depends_on:
      - rabbitmq
      - redis
      - postgresql
    command: [
        "-A", "rnseism_sdk.worker.batch_worker", "worker",
        "-Q", "batch_tasks",
        "--pool=prefork", "--concurrency=4", "--loglevel=DEBUG"
    ]
    hostname: "batch_worker"
    networks:
      - deploy_net
    environment:
      CELERY_BROKER_URL: "amqp://guest:guest@rabbitmq:5672"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      WMS_WORKER_NETWORK: "geowsm_docker_deploy_net"
      WMS_BATCH_WORKER_CONFIG_VOLUME: "/home/rn/geowsm/deployment/geowsm_docker/worker_config.yaml"
      WMS_BATCH_WORKER_DONT_REMOVE_FAILED_CONTAINER: "true"
      WMS_RUNNER_DB_CONN: "postgresql://postgres:postgres@postgresql:5432/wms"
      WMS_BATCH_WORKER_TYPE: 'docker'

      WMS_HDFS_CLUSTER_NAME: "${HDFS_CLUSTER_NAME}"
      WMS_HDFS_NAMENODE_HEAPSIZE: "${HDFS_NAMENODE_HEAPSIZE}"
      WMS_HDFS_NN_RPC_URI: "${HDFS_NN_RPC_URI}"
      WMS_HDFS_NN_HTTP_URI: "${HDFS_NN_HTTP_URI}"
      WMS_HDFS_DATANODE_HOSTNAME: "${HDFS_DATANODE_HOSTNAME}"

      SEISMREADER_COORDINATOR_HOST_PORT: "${SEISMREADER_COORDINATOR_HOST_PORT}"
      SEISMREADER_RABBITMQ_HOST: "${SEISMREADER_RABBITMQ_HOST}"
      SEISMREADER_RABBITMQ_PORT: "${SEISMREADER_RABBITMQ_PORT}"
      SEISMREADER_WORKER_IDS: "${SEISMREADER_WORKER_IDS}"
      SEISMREADER_WORKER_ADDRESSES: "${SEISMREADER_WORKER_ADDRESSES}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./worker_config.yaml:/worker_config.yaml

  app:
    image: geowsm-app:latest
    build:
      context: ../..
      dockerfile: ./docker/app.dockerfile
    depends_on:
      - rabbitmq
      - redis
      - postgresql
      - batch_worker
    hostname: "geowsm"
    environment:
      IGNORE_JWT_AUTH: "true"
      JWT_PRIVATE_KEY_PATH: "/jwt-keys/private.key"

      CELERY_BROKER_URL: "amqp://guest:guest@rabbitmq:5672"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"

      WMS_RESULT_STORAGE_URL: "redis://redis:6379/2"
      WMS_SESSION_STATUS_STORAGE_URL: "redis://redis:6379/4"
      WMS_BATCH_WORKER_CONFIG_VOLUME: "/home/rn/geowsm/deployment/geowsm_docker/worker_config.yaml"

      WMS_WORKER_NETWORK: "geowsm_docker_deploy_net"
      WMS_HANDLE_TUNINGS_MODE: "normal"
      WMS_TUNINGS_PROJECTS_AND_USES_API_URL: "http://10.32.0.243:8094"

      WMS_POSTGRES_URL: "postgresql+asyncpg://postgres:postgres@postgresql:5432/wms"
      WMS_RUNNER_DB_CONN: "postgresql://postgres:postgres@postgresql:5432/wms"
      WMS_EXECUTION_BACKEND: "docker"

      WMS_HDFS_CLUSTER_NAME: "${HDFS_CLUSTER_NAME}"
      WMS_HDFS_NAMENODE_HEAPSIZE: "${HDFS_NAMENODE_HEAPSIZE}"
      WMS_HDFS_NN_RPC_URI: "${HDFS_NN_RPC_URI}"
      WMS_HDFS_NN_HTTP_URI: "${HDFS_NN_HTTP_URI}"
      WMS_HDFS_DATANODE_HOSTNAME: "${HDFS_DATANODE_HOSTNAME}"

      SEISMREADER_COORDINATOR_HOST_PORT: "${SEISMREADER_COORDINATOR_HOST_PORT}"
      SEISMREADER_RABBITMQ_HOST: "${SEISMREADER_RABBITMQ_HOST}"
      SEISMREADER_RABBITMQ_PORT: "${SEISMREADER_RABBITMQ_PORT}"
      SEISMREADER_WORKER_IDS: "${SEISMREADER_WORKER_IDS}"
      SEISMREADER_WORKER_ADDRESSES: "${SEISMREADER_WORKER_ADDRESSES}"
    ports:
      - "8097:5000"
    networks:
      - deploy_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./worker_config.yaml:/worker_config.yaml

  geowsm-node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    ports:
      - "9100:9100"
    networks:
      - deploy_net
    command:
      - '--path.rootfs=/host'
      - --collector.disable-defaults
      - --web.disable-exporter-metrics
      - --collector.cpu
      - --collector.uname
      - --collector.meminfo
      - --collector.filesystem
      - --collector.filesystem.mount-points-exclude=^/(dev|data|boot|run|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'

  geowsm-prometheus:
    image: geowsm-prometheus:latest
    build:
      context: ../../prometheus
    depends_on:
      - geowsm-node-exporter
    ports:
      - "9090:9090"
    networks:
      - deploy_net

configs:
  rabbitmq_consumer_settings:
    file: ./consumer-settings.conf

  rabbitmq_conf:
    file: ./rabbitmq.conf

  rabbitmq_enabled_plugins:
    file: ./enabled_plugins

networks:
  deploy_net:
